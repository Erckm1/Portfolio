<!--
  ═══════════════════════════════════════════════════════════════════════════
  CONCEPTO: Property Binding  →  [propiedad]="expresión"
  Los corchetes [ ] indican que el valor es dinámico (evaluado en TypeScript).
  Sin corchetes sería un string literal: class="valor-fijo".

  Aquí [class] cambia las clases CSS del <nav> según si el usuario ha hecho
  scroll o no. Cuando el signal scrolled() devuelve true, se aplican las
  clases del fondo semitransparente; si es false, el nav es transparente.
  ═══════════════════════════════════════════════════════════════════════════
-->
<nav [class]="scrolled()
  ? 'fixed top-0 left-0 right-0 z-50 transition-all duration-500 py-3 bg-[var(--background)]/80 backdrop-blur-xl border-b border-[var(--glass-border)]'
  : 'fixed top-0 left-0 right-0 z-50 transition-all duration-500 py-5 bg-transparent'">

  <div class="max-w-7xl mx-auto px-6 flex items-center justify-between">

    <!-- ─── Logo ─────────────────────────────────────────────────────────
      CONCEPTO: Event Binding  →  (evento)="método()"
      Los paréntesis ( ) enlazan eventos del DOM con métodos de la clase.
      (click)="scrollToTop()" → cuando el usuario hace clic, se ejecuta
      scrollToTop() en navbar-component.ts.
    ──────────────────────────────────────────────────────────────────── -->
    <button (click)="scrollToTop()" class="flex items-center gap-2.5 group">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 via-violet-500 to-cyan-400 flex items-center justify-center shadow-lg group-hover:shadow-indigo-500/30 transition-shadow duration-300">
        <span class="text-white text-sm font-bold tracking-tight" style="font-family: var(--font-display)">EM</span>
      </div>
      <span class="text-foreground font-semibold text-base hidden sm:block" style="font-family: var(--font-display)">
        Erick Molinero
      </span>
    </button>

    <!-- ─── Navegación escritorio ─────────────────────────────────────────
      CONCEPTO: @for (bucle en template)
      Equivalente al *ngFor de versiones anteriores. Itera sobre 'navLinks'
      y crea un <button> por cada elemento.

        link       → variable local que representa el elemento actual
        of navLinks → el array de la clase que se recorre
        track link.href → clave única para que Angular identifique cada
                          elemento y actualice el DOM de forma eficiente
                          (evita re-renderizar todo cuando algo cambia).

      {{ link.label }} → Interpolación: muestra el valor de la propiedad
                         como texto en el HTML.
    ──────────────────────────────────────────────────────────────────── -->
    <div class="hidden md:flex items-center gap-1">
      @for (link of navLinks; track link.href) {
        <button
          (click)="handleNav(link.href)"
          class="px-4 py-2 text-sm text-muted-foreground hover:text-foreground transition-colors duration-200 rounded-lg hover:bg-[var(--glass-bg)]">
          {{ link.label }}
        </button>
      }
    </div>

    <!-- ─── Acciones escritorio ───────────────────────────────────────────
      CONCEPTO: @if (condicional en template)
      Equivalente al *ngIf de versiones anteriores.
      Renderiza (o no) un bloque de HTML según una condición booleana.

      CONCEPTO: Output → emit()
      (click)="toggleDarkMode.emit()" dispara el EventEmitter definido
      en la clase con @Output(). El componente padre recibirá este evento
      y ejecutará su propia lógica (ej: cambiar el tema de la app).
      Este componente NO sabe qué hace el padre — solo avisa.
    ──────────────────────────────────────────────────────────────────── -->
    <div class="hidden md:flex items-center gap-3">
      <button
        (click)="toggleDarkMode.emit()"
        class="p-2.5 rounded-xl border border-[var(--glass-border)] bg-[var(--glass-bg)] text-muted-foreground hover:text-foreground transition-all duration-200 hover:border-indigo-500/30">
        <!-- @if muestra el sol si darkMode es true, la luna si es false -->
        @if (darkMode) {
          <!-- Sun icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
        } @else {
          <!-- Moon icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        }
      </button>

      <!-- ─── Botón "Hire Me" ─────────────────────────────────────────────
        CONCEPTO: $event
        $event es el objeto nativo del evento del DOM.
        $event.preventDefault() cancela el comportamiento por defecto del
        <a> (navegar a #contact recargando la página) para que podamos
        manejar el scroll suave nosotros mismos con handleNav().
      ──────────────────────────────────────────────────────────────────── -->
      <a
        href="#contact"
        (click)="$event.preventDefault(); handleNav('#contact')"
        class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-indigo-500 to-violet-600 text-white text-sm font-medium hover:shadow-lg hover:shadow-indigo-500/25 transition-all duration-300 hover:-translate-y-0.5">
        Hire Me
      </a>
    </div>

    <!-- ─── Controles móvil ───────────────────────────────────────────────
      En móvil se muestra el botón de dark mode y el botón hamburguesa.
      'hidden md:flex' es Tailwind: oculto en pantallas >= md (768px),
      visible solo en pantallas pequeñas — lógica opuesta al desktop nav.
    ──────────────────────────────────────────────────────────────────── -->
    <div class="flex md:hidden items-center gap-2">
      <button
        (click)="toggleDarkMode.emit()"
        class="p-2 rounded-lg border border-[var(--glass-border)] bg-[var(--glass-bg)] text-muted-foreground">
        @if (darkMode) {
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        }
      </button>

      <!-- Botón hamburguesa / X: alterna mobileOpen con toggleMobile() -->
      <button
        (click)="toggleMobile()"
        class="p-2 rounded-lg border border-[var(--glass-border)] bg-[var(--glass-bg)] text-foreground">
        @if (mobileOpen()) {
          <!-- Icono X: indica que se puede cerrar el menú -->
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        } @else {
          <!-- Icono hamburguesa: indica que se puede abrir el menú -->
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" x2="20" y1="12" y2="12"/>
            <line x1="4" x2="20" y1="6" y2="6"/>
            <line x1="4" x2="20" y1="18" y2="18"/>
          </svg>
        }
      </button>
    </div>
  </div>

  <!-- ─── Menú móvil desplegable ──────────────────────────────────────────
    CONCEPTO: @if con signal
    mobileOpen() — los paréntesis leen el valor actual del signal.
    Cuando es true, Angular inserta este bloque en el DOM.
    Cuando es false, lo elimina completamente (no solo lo oculta con CSS).
    Esto es más eficiente que display:none para bloques grandes.

    CONCEPTO: @for en móvil
    El mismo array navLinks se reutiliza — principio DRY (Don't Repeat Yourself).
    La diferencia con el desktop es solo el estilo CSS (layout vertical vs horizontal).
  ──────────────────────────────────────────────────────────────────────── -->
  @if (mobileOpen()) {
    <div class="md:hidden absolute top-full left-0 right-0 bg-[var(--background)]/95 backdrop-blur-xl border-b border-[var(--glass-border)] py-4 px-6">
      <div class="flex flex-col gap-1">
        @for (link of navLinks; track link.href) {
          <button
            (click)="handleNav(link.href)"
            class="text-left px-4 py-3 text-sm text-muted-foreground hover:text-foreground hover:bg-[var(--glass-bg)] rounded-lg transition-colors">
            {{ link.label }}
          </button>
        }
        <div class="mt-3 pt-3 border-t border-[var(--glass-border)]">
          <button
            (click)="handleNav('#contact')"
            class="w-full px-5 py-3 rounded-xl bg-gradient-to-r from-indigo-500 to-violet-600 text-white text-sm font-medium">
            Hire Me
          </button>
        </div>
      </div>
    </div>
  }
</nav>
