<section id="tech" class="py-24 relative">
  <div class="absolute inset-0 pointer-events-none"
    style="background: radial-gradient(ellipse at 20% 50%, rgba(34,211,238,0.05) 0%, transparent 60%)"></div>
  <div class="max-w-7xl mx-auto px-6">
    <div class="text-center mb-16">
      <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full border border-cyan-500/20 bg-cyan-500/8 text-cyan-400 text-xs font-medium mb-5">
        Technical Arsenal
      </div>
      <h2 class="text-foreground mb-4" style="font-family: var(--font-display); font-size: 2.5rem; font-weight: 700">
        Technology Stack
      </h2>
      <p class="text-muted-foreground max-w-lg mx-auto">
        A curated set of technologies I use to build reliable, scalable enterprise software.
      </p>
    </div>

    <!-- Category filter -->
    <div class="flex flex-wrap justify-center gap-2 mb-12">
      @for (cat of categories; track cat) {
        <button (click)="setCategory(cat)"
          [class]="isActive(cat)
            ? 'px-5 py-2.5 rounded-xl text-sm font-medium bg-gradient-to-r from-indigo-500 to-violet-600 text-white shadow-lg shadow-indigo-500/25 transition-all duration-200'
            : 'px-5 py-2.5 rounded-xl text-sm font-medium border border-[var(--glass-border)] bg-[var(--glass-bg)] text-muted-foreground hover:text-foreground hover:border-indigo-500/20 transition-all duration-200'">
          {{ cat }}
        </button>
      }
    </div>

    <!-- Tech grid -->
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
      @for (tech of filteredTechnologies(); track tech.name) {
        <div class="group flex flex-col gap-3 p-4 rounded-xl border backdrop-blur-sm hover:-translate-y-1 transition-all duration-300 cursor-default"
          [class]="tech.border + ' ' + tech.bg">
          <div class="flex items-center gap-2.5">
            <span class="text-xl">{{ tech.icon }}</span>
            <span class="text-sm font-medium" [class]="tech.color" style="font-family: var(--font-mono)">{{ tech.name }}</span>
          </div>
          <div class="flex items-center gap-2">
            <div class="flex-1 h-1 rounded-full bg-[var(--glass-border)]">
              <div class="h-full rounded-full transition-all duration-700"
                [style.width]="tech.level + '%'"
                style="background: var(--gradient-primary)"></div>
            </div>
            <span class="text-xs text-muted-foreground" style="font-family: var(--font-mono)">{{ tech.level }}%</span>
          </div>
        </div>
      }
    </div>
  </div>
</section>
