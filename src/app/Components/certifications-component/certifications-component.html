<section id="certifications" class="py-24 relative">
  <div class="absolute inset-0 pointer-events-none"
    style="background: radial-gradient(ellipse at 80% 40%, rgba(34,211,238,0.05) 0%, transparent 60%)"></div>
  <div class="max-w-7xl mx-auto px-6">
    <div class="text-center mb-16">
      <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full border border-sky-500/20 bg-sky-500/8 text-sky-400 text-xs font-medium mb-5">
        Credentials
      </div>
      <h2 class="text-foreground mb-4" style="font-family: var(--font-display); font-size: 2.5rem; font-weight: 700">
        Certifications
      </h2>
      <p class="text-muted-foreground max-w-lg mx-auto">
        Industry-recognized credentials validating expertise in cloud, security, and agile methodologies.
      </p>
    </div>

    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-5">
      @for (cert of certifications; track cert.id) {
        <div class="group flex flex-col gap-5 p-6 rounded-2xl border bg-[var(--glass-bg)] backdrop-blur-sm transition-all duration-300 hover:-translate-y-1 overflow-hidden relative"
          [class]="colors(cert.color).border">

          <!-- Background glow -->
          <div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none"
            [class]="colors(cert.color).bg"></div>

          <div class="relative flex items-start justify-between">
            <div class="w-12 h-12 rounded-xl border flex items-center justify-center text-2xl"
              [class]="colors(cert.color).bg + ' ' + colors(cert.color).border.split(' ')[0]">
              {{ cert.icon }}
            </div>
            <a [href]="cert.verifyUrl"
              class="p-2 rounded-lg border border-[var(--glass-border)] bg-[var(--glass-bg)] text-muted-foreground hover:text-foreground transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
              </svg>
            </a>
          </div>

          <div class="relative flex flex-col gap-2">
            <h3 class="text-foreground leading-tight" style="font-family: var(--font-display); font-size: 0.975rem; font-weight: 600">
              {{ cert.name }}
            </h3>
            <div class="flex items-center justify-between">
              <span class="text-muted-foreground text-sm font-medium">{{ cert.issuer }}</span>
              <span class="px-2 py-0.5 rounded-md text-xs font-medium" [class]="colors(cert.color).badge" style="font-family: var(--font-mono)">
                {{ cert.id }}
              </span>
            </div>
            <p class="text-muted-foreground text-xs leading-relaxed">{{ cert.description }}</p>
          </div>

          <div class="relative flex items-center gap-1.5 text-xs text-muted-foreground mt-auto">
            <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/>
            </svg>
            <span>Issued {{ cert.date }}</span>
            <div class="ml-auto flex items-center gap-1.5">
              <div class="w-1.5 h-1.5 rounded-full bg-emerald-400"></div>
              <span class="text-emerald-400">Active</span>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
